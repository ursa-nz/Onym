<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="99" rx="46" ry="6" fill="#000000" opacity="0.13" filter="url(#soft)"/>

  <!-- cover, deep blue, peeking at the outer edges, the foot, and the spine -->
  <path d="M18,63 L64,70 L64,98 L18,91 Z" fill="#1a5fb4"/>
  <path d="M110,63 L64,70 L64,98 L110,91 Z" fill="#1a5fb4"/>
  <rect x="62" y="62" width="4" height="34" fill="#15508f"/>

  <!-- pages, cream -->
  <path d="M23,60 L63,66 L63,93 L23,87 Z" fill="#f6f5f4"/>
  <path d="M105,60 L65,66 L65,93 L105,87 Z" fill="#f6f5f4"/>
  <!-- a soft edge along the foot of each page -->
  <path d="M23,87 L63,93 L63,90 L23,84 Z" fill="#d9d4cd" opacity="0.7"/>
  <path d="M105,87 L65,93 L65,90 L105,84 Z" fill="#d9d4cd" opacity="0.7"/>

  <!-- faint text lines -->
  <g stroke="#cdc7be" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="72" x2="56" y2="75"/>
    <line x1="30" y1="78" x2="56" y2="81"/>
    <line x1="72" y1="75" x2="98" y2="72"/>
    <line x1="72" y1="81" x2="98" y2="78"/>
  </g>

  <!-- a word and its relations rising from the spine -->
  <g stroke="#e66100" stroke-width="2.8" stroke-linecap="round">
    <line x1="64" y1="55" x2="47" y2="40"/>
    <line x1="64" y1="55" x2="64" y2="31"/>
    <line x1="64" y1="55" x2="81" y2="41"/>
  </g>
  <g fill="#ff7800">
    <circle cx="64" cy="55" r="5"/>
    <circle cx="47" cy="39" r="3.9"/>
    <circle cx="64" cy="31" r="3.9"/>
    <circle cx="81" cy="40" r="3.9"/>
  </g>
</svg>
