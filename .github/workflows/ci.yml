name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside an Ubuntu 24.04 container, the oldest release that meets our GTK 4.14 and
    # libadwaita 1.5 floors. This pins the toolchain regardless of the runner image, so the
    # application (an auto feature) is actually compiled rather than silently dropped, and the
    # build is exercised against the minimum supported toolchain.
    container: ubuntu:24.04
    steps:
      # The base image is minimal and runs as root. Install git, which the checkout action needs,
      # before that step; GitHub mounts its own Node into the container. There is no sudo because
      # we are already root.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            meson ninja-build gcc pkg-config \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            gobject-introspection libgirepository1.0-dev \
            wordnet-base pipx \
            gettext appstream desktop-file-utils

      - uses: actions/checkout@v4

      # The lookup engine builds from the sibling onym-engine checkout, the same convention its
      # conformance kit uses.
      - name: Check out onym-engine
        run: git clone --depth 1 https://github.com/ursa-nz/onym-engine ../onym-engine

      # Ubuntu 24.04's rustc predates edition 2024, so install the stable toolchain with rustup;
      # cargo then honours the engine's rust-toolchain.toml pin.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: REUSE lint
        # reuse is fetched from PyPI at run time and the current release refuses
        # to start without an encoding-detection module. Pull the
        # charset-normalizer extra so the install is self-contained.
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint

      - name: Configure
        run: meson setup _build

      - name: Build
        run: meson compile -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

  # Lint the Flatpak manifest with the Flathub linter image. This is the fast check: it fails on a
  # broken manifest without waiting for the full build below. desktop-file-validate and
  # appstreamcli validate --strict already run in the build job through meson test.
  flatpak-manifest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-builder-lint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Flatpak manifest
        run: flatpak-builder-lint manifest build-aux/nz.ursa.Onym.yaml

  # Build the Flatpak for real with flatpak-builder, then lint the built result and export the
  # bundle. This pulls the GNOME 50 runtime and Sdk and builds the bundled WordNet from source, so
  # it is the slow job. The built-result lint fetches the screenshots named in the metainfo, which
  # resolve now that the repository is public. flatpak-builder is run directly rather than through
  # the flatpak-github-actions action, which targets GitHub; the commands run unchanged on Forgejo.
  flatpak-build:
    runs-on: ubuntu-latest
    container:
      # The Flathub builder image ships flatpak-builder, flatpak-builder-lint, and the GNOME 50
      # runtime and Sdk. flatpak-builder needs bubblewrap, so the container must be privileged.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # The manifest stages the engine from the sibling checkout.
      - name: Check out onym-engine
        run: git clone --depth 1 https://github.com/ursa-nz/onym-engine ../onym-engine

      # Build against the system installation, where the image has baked the GNOME 50 runtime and
      # Sdk, rather than the per-user one, which is empty and has no remote (the runner sets HOME to
      # a temporary directory). Add the flathub remote as a safety net so install-deps-from resolves
      # if a dependency is missing. rofiles-fuse needs a FUSE device the runner may not grant, so
      # disable it.
      #
      # We self-host (not Flathub), so the metainfo keeps its forge.ursa.nz screenshot URLs and we do
      # not mirror them anywhere. compose-url-policy=full keeps those external URLs in the composed
      # AppStream so GNOME Software can fetch them. The built-result lint below is informational for
      # the same reason: its screenshot/icon checks only pass when mirrored to dl.flathub.org.
      - name: Build
        run: |
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --install-deps-from=flathub \
            --compose-url-policy=full \
            --repo=repo --force-clean builddir build-aux/nz.ursa.Onym.yaml

      # Lint the built tree against the appstream and Flatpak rules, the screenshots among them.
      - name: Lint the built result
        # Informational: flatpak-builder-lint enforces Flathub policy (mirror screenshots/icons
        # to dl.flathub.org), which does not apply to self-hosting.
        run: flatpak-builder-lint repo repo || true

      - name: Bundle
        run: |
          flatpak build-bundle repo onym.flatpak nz.ursa.Onym \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: onym.flatpak
          path: onym.flatpak
