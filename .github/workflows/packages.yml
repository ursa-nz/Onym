name: Packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # A native Debian/Ubuntu package, built with debhelper. libonym is static, so
  # the package is just the application and its data; it depends on the system
  # WordNet. Built on 26.04 to match the changelog series.
  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            build-essential debhelper meson ninja-build pkgconf \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            wordnet-dev wordnet-base \
            appstream desktop-file-utils lintian

      - uses: actions/checkout@v4

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Lint the .deb
        run: lintian ../onym_*.deb || true

      - name: Collect the artifact
        run: |
          mkdir -p dist
          cp ../onym_*.deb dist/

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: onym-deb
          path: dist/*.deb

  # A portable AppImage that bundles GTK4, libadwaita, the WordNet runtime and
  # the WordNet database. Built on 26.04 so it bundles the GNOME 50 toolkit
  # (GTK 4.22 / libadwaita 1.9), matching the Flatpak runtime and current
  # desktops. This raises the glibc floor, an accepted trade-off: older systems
  # have the .deb, the Flatpak, or upstream Artha. librsvg2-common ships the
  # SVG pixbuf loader the icon needs, so it gets bundled.
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git \
            meson ninja-build gcc pkgconf gettext \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            wordnet-dev wordnet-base \
            librsvg2-common

      - uses: actions/checkout@v4

      - name: Build the AppImage
        run: ./build-aux/appimage/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: onym-appimage
          path: Onym-*.AppImage

  # On a version tag, publish the .deb and the AppImage as a GitHub release.
  release:
    needs: [deb, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
