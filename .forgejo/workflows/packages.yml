name: Packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # A portable AppImage that bundles GTK4, libadwaita and the pinned WordNet data, so it runs on any
  # reasonably current Linux desktop with nothing installed. Built on 26.04 so it bundles the GNOME
  # 50 toolkit (GTK 4.22 / libadwaita 1.9), matching the Flatpak runtime and current desktops. This
  # raises the glibc floor, an accepted trade-off: older systems have the Flatpak or upstream Artha.
  # dpkg-dev provides dpkg-architecture, which linuxdeploy-plugin-gtk calls to locate the multiarch
  # library directory and aborts without. librsvg2-common ships the SVG pixbuf loader the icon needs
  # and libgdk-pixbuf2.0-bin the gdk-pixbuf-query-loaders tool the plugin runs to register it. zstd
  # is what prepare.sh uses to decompress the bundled data; there is no system WordNet.
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git nodejs zstd \
            meson ninja-build gcc pkgconf gettext dpkg-dev \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            cargo rustc \
            librsvg2-common libgdk-pixbuf2.0-bin

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The lookup engine builds from the sibling core checkout; the data comes from the onym-data
      # submodule, which build-appimage.sh materialises with prepare.sh.
      - name: Check out onym-engine
        run: git clone --depth 1 https://forge.ursa.nz/ursa-nz/onym-engine.git ../core

      - name: Build the AppImage
        run: ./build-aux/appimage/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v3
        with:
          name: Onym-x86_64.AppImage
          path: Onym-*.AppImage

  # On a version tag, publish the AppImage as a Forgejo release. The software.ursa.nz publisher
  # imports release assets from this forge, so this job is what carries a tagged version into the
  # download page; without it a tag ships only from GitHub and the two quietly fall behind. The
  # release body comes from the version's metainfo entry via build-aux/release-notes. The Flatpak
  # bundle is still built locally with flatpak-builder and attached by hand, because the runner has
  # no Flatpak runtimes; the publisher picks up late-attached assets on its next pass.
  release:
    needs: [appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq nodejs python3

      - uses: actions/checkout@v4

      - name: Download the built packages
        uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Create the release and attach the packages
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # An existing release is completed, not replaced: the body is written only on
        # creation and an asset already attached is kept, so a re-run never clobbers a
        # hand-edited release, and a version keeps mapping to one set of bytes.
        run: |
          set -eu
          if ! release=$(curl -fsS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG"); then
            ./build-aux/release-notes "${TAG#v}" > notes.md
            release=$(jq -n --arg tag "$TAG" --arg name "Onym ${TAG#v}" --rawfile body notes.md \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
              | curl -fsS -X POST -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" -d @- "$API/releases")
          fi
          id=$(jq -r '.id' <<<"$release")
          jq -r '.assets[].name' <<<"$release" > attached.txt
          for file in dist/*/*; do
            name=$(basename "$file")
            if grep -qxF "$name" attached.txt; then
              echo "$name is already attached; kept"
              continue
            fi
            curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$id/assets?name=$name" >/dev/null
            echo "$name attached"
          done
