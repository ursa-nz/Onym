# Flathub submission manifest. Copy this file into the Flathub repository at
# github.com/flathub/nz.ursa.Onym. It mirrors build-aux/nz.ursa.Onym.yaml, the manifest used for
# local builds and CI, with one change: the application and the engine are built from pinned
# revisions instead of the local working trees, which is what Flathub's network-isolated builders
# require. Keep the WordNet data module here in step with the development manifest.
id: nz.ursa.Onym
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# The lookup engine is the shared onym-engine Rust core, built from source by meson via cargo.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: onym

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # The pinned WordNet data from onym-data, the base graph and the etymology and translation overlays
  # together, bundled so the app needs nothing installed. Flathub's builders fetch sources before the
  # network-isolated build, so a pinned public revision is fetched here and prepare.sh decompresses
  # it in place; nothing is reached for at build time. Bump the commit alongside data releases.
  - name: wordnet-data
    buildsystem: simple
    build-commands:
      - ./prepare.sh /app/share/wordnet
    sources:
      - type: git
        url: https://forge.ursa.nz/ursa-nz/onym-data.git
        commit: b6419c86b26422c47b27d1db9d370d414b60e5db

  - name: onym
    buildsystem: meson
    # Run the test suite during the build so test-lookup exercises the engine against the bundled
    # data, proving the bundle works before it ships.
    run-tests: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    config-opts:
      - -Dwordnet_data_dir=/app/share/wordnet
      - -Donym_engine_dir=onym-engine
      - -Dapp=enabled
      - -Dintrospection=disabled
    sources:
      # Pinned to the tagged release. Flathub's builders have no network access during the build,
      # so the application source must come from a fixed, public revision, not the local working
      # tree. The data is the wordnet-data module above, so this checkout skips the submodule. Bump
      # the tag and commit on each release, or let the x-checker-data bot below propose it.
      - type: git
        url: https://forge.ursa.nz/ursa-nz/Onym.git
        tag: v0.2.0
        commit: 25083184bb6d0b4be4205dbfa657492ec4f52ff3
        disable-submodules: true
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
      # The engine, pinned the same way and staged where -Donym_engine_dir points. Bump the
      # commit alongside engine releases.
      - type: git
        url: https://forge.ursa.nz/ursa-nz/onym-engine.git
        commit: 9aa4733bad85e05e03f131ff85048fa2b5412dea
        dest: onym-engine
