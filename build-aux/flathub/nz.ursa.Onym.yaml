# Flathub submission manifest. Copy this file into the Flathub repository at
# github.com/flathub/nz.ursa.Onym. It mirrors build-aux/nz.ursa.Onym.yaml, the manifest used for
# local builds and CI, with one change: the application and the engine are built from pinned
# revisions instead of the local working trees, which is what Flathub's network-isolated builders
# require. Keep the WordNet data module here in step with the development manifest.
id: nz.ursa.Onym
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# The lookup engine is the shared onym-engine Rust core, built from source by meson via cargo.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: onym

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # The WordNet 3.0 database, bundled so the app needs nothing installed. It is the prebuilt,
  # architecture-independent wordnet-base package, which carries Debian's database fixes; the
  # engine reads it in place, read-only.
  - name: wordnet-data
    buildsystem: simple
    build-commands:
      - ar x wordnet-base.deb
      - tar -xJf data.tar.xz
      - install -d /app/share/wordnet
      - cp -a usr/share/wordnet/. /app/share/wordnet/
    sources:
      - type: file
        url: https://deb.debian.org/debian/pool/main/w/wordnet/wordnet-base_3.0-41_all.deb
        sha256: e50d14b2ee444eaf36ef2a3bd38e50c623b47ba22b2301adc4a5f12736da9264
        dest-filename: wordnet-base.deb

  - name: onym
    buildsystem: meson
    # Run the test suite during the build so test-lookup exercises the engine against the bundled
    # database, proving the bundle works before it ships.
    run-tests: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    config-opts:
      - -Dwordnet_data_dir=/app/share/wordnet
      - -Donym_engine_dir=onym-engine
      - -Dapp=enabled
      - -Dintrospection=disabled
      # Install the etymology overlay alongside the bundled WordNet database.
      - -Dbundle_wordnet_overlay=true
    sources:
      # Pinned to the tagged release. Flathub's builders have no network access during the build,
      # so the application source must come from a fixed, public revision, not the local working
      # tree. Bump the tag and commit on each release, or let the x-checker-data bot below propose
      # it.
      - type: git
        url: https://forge.ursa.nz/ursa-nz/Onym.git
        tag: v0.2.0
        commit: 25083184bb6d0b4be4205dbfa657492ec4f52ff3
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
      # The engine, pinned the same way and staged where -Donym_engine_dir points. Bump the
      # commit alongside engine releases.
      - type: git
        url: https://forge.ursa.nz/ursa-nz/onym-engine.git
        commit: 9aa4733bad85e05e03f131ff85048fa2b5412dea
        dest: onym-engine
