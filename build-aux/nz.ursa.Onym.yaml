id: nz.ursa.Onym
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# The lookup engine is the shared onym-engine Rust core, built from source by meson via cargo.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: onym

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # The pinned WordNet data from the onym-data submodule, the base graph and the etymology overlay
  # together, bundled so the app needs nothing installed and the builder fetches nothing at build
  # time. prepare.sh decompresses the vendored blob in place, with no network.
  - name: wordnet-data
    buildsystem: simple
    build-commands:
      - ./prepare.sh /app/share/wordnet
    sources:
      - type: dir
        path: ../onym-data
        skip:
          - .git
          - build

  - name: onym
    buildsystem: meson
    # Run the test suite during the build so test-lookup exercises the engine against the bundled
    # data, proving the bundle works before it ships.
    run-tests: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    config-opts:
      - -Dwordnet_data_dir=/app/share/wordnet
      - -Donym_engine_dir=onym-engine
      - -Dapp=enabled
      - -Dintrospection=disabled
    sources:
      - type: dir
        path: ..
        skip:
          - _build
          - .git
          - .flatpak-builder
          # The data is bundled by the wordnet-data module above, not as app source.
          - onym-data
      # The engine checkout, staged into the build tree where -Donym_engine_dir points. The
      # sibling-directory convention matches the conformance kit's.
      - type: dir
        path: ../../core
        dest: onym-engine
        skip:
          - target
          - .git
