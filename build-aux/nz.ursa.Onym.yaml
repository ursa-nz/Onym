id: nz.ursa.Onym
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# The lookup engine is the shared onym-engine Rust core, built from source by meson via cargo.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: onym

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # The WordNet 3.0 database, bundled so the app needs nothing installed. It is the prebuilt,
  # architecture-independent wordnet-base package, which carries Debian's database fixes; the
  # engine reads it in place, read-only.
  - name: wordnet-data
    buildsystem: simple
    build-commands:
      - ar x wordnet-base.deb
      - tar -xJf data.tar.xz
      - install -d /app/share/wordnet
      - cp -a usr/share/wordnet/. /app/share/wordnet/
    sources:
      - type: file
        url: https://deb.debian.org/debian/pool/main/w/wordnet/wordnet-base_3.0-41_all.deb
        sha256: e50d14b2ee444eaf36ef2a3bd38e50c623b47ba22b2301adc4a5f12736da9264
        dest-filename: wordnet-base.deb

  - name: onym
    buildsystem: meson
    # Run the test suite during the build so test-lookup exercises the engine against the bundled
    # database, proving the bundle works before it ships.
    run-tests: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    config-opts:
      - -Dwordnet_data_dir=/app/share/wordnet
      - -Donym_engine_dir=onym-engine
      - -Dapp=enabled
      - -Dintrospection=disabled
      # Install the etymology overlay alongside the bundled WordNet database.
      - -Dbundle_wordnet_overlay=true
    sources:
      - type: dir
        path: ..
        skip:
          - _build
          - .git
          - .flatpak-builder
      # The engine checkout, staged into the build tree where -Donym_engine_dir points. The
      # sibling-directory convention matches the conformance kit's.
      - type: dir
        path: ../../onym-engine
        dest: onym-engine
        skip:
          - target
          - .git
